<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Сводка · Aira</title>
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<header>
  <div class="top">
    <h1>Сводка</h1>
    <span class="upd" id="upd"></span>
    <button class="chip" id="refresh" aria-label="Обновить">Обновить</button>
  </div>
</header>

<main class="wrap">
  <section class="sec" aria-labelledby="hBiz">
    <div class="sec-head"><h2 id="hBiz">Бизнес</h2></div>
    <div class="tiles">
      <div class="tile" id="tMrr"><div class="label">MRR</div><div class="value">—</div><div class="sub"></div></div>
      <div class="tile" id="tClients"><div class="label">Клиенты</div><div class="value">—</div><div class="sub"></div></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="hLeads">
    <div class="sec-head">
      <h2 id="hLeads">Лиды Aira Home</h2>
      <div class="seg" id="region" role="group" aria-label="Регион">
        <button class="chip" data-r="all">Все</button><button class="chip" data-r="lisboa">Лиссабон</button><button class="chip" data-r="algarve">Алгарве</button>
      </div>
    </div>
    <div class="tiles">
      <a class="tile" id="tLeads" href="/dashboard/leads">
        <div class="label">Лиды · сегодня <span class="go">›</span></div>
        <div class="value">—</div>
        <div class="sub" id="leadsSub">загрузка…</div>
        <div class="sub" id="leadsSrc"></div>
        <svg class="spark" id="spark" viewBox="0 0 120 28" width="100%" height="28" preserveAspectRatio="none" aria-hidden="true"></svg>
      </a>
      <a class="tile" id="tComp" href="/dashboard/competitors">
        <div class="label">Конкуренты <span class="go">›</span></div><div class="value">—</div><div class="sub">профилей мастеров</div>
      </a>
      <a class="tile" id="tB2b" href="/dashboard/b2b">
        <div class="label">B2B-контакты <span class="go">›</span></div><div class="value">—</div><div class="sub">компании с телефонами</div>
      </a>
    </div>
  </section>

  <section class="sec" aria-labelledby="hOps">
    <div class="sec-head"><h2 id="hOps">Работа и система</h2></div>
    <div class="tiles">
      <a class="tile" id="tTasks" href="/dashboard/tasks">
        <div class="label">Задачи <span class="go">›</span></div><div class="value">—</div><div class="sub">загрузка…</div>
      </a>
      <a class="tile" id="tTech" href="/dashboard/tech">
        <div class="label">Техстатус <span class="go">›</span></div><div class="value">—</div><div class="sub">загрузка…</div>
      </a>
      <a class="tile" id="tScout" href="https://stats.aira-ai.net/scout" target="_blank" rel="noopener">
        <div class="label">Scout · MacroDroid <span class="go">↗</span></div><div class="value">—</div><div class="sub">загрузка…</div>
      </a>
    </div>
  </section>
</main>

<footer class="foot">
  <a href="/board">Старая доска задач</a>
  <a href="/dashboard-legacy">Старая сводка</a>
  <a href="https://stats.aira-ai.net/scout" target="_blank" rel="noopener">Scout-дашборд</a>
</footer>

<script src="/dashboard/app.js"></script>
<script src="/dashboard/nav.js"></script>
<script>
const RN = {lisboa:'Лиссабон', algarve:'Алгарве'};
let region = store.get('lead_region', 'all');
if (!['all','lisboa','algarve'].includes(region)) region = 'all';

function tile(id, value, sub, bad){
  const t = $(id);
  t.querySelector('.value').innerHTML = value;
  if (sub !== undefined) t.querySelector('.sub').innerHTML = sub;
  t.classList.toggle('bad', !!bad);
}
const noData = why => `<span>нет данных${why ? ' · ' + esc(why) : ''}</span>`;

async function loadBusiness(){
  try {
    const c = await getJSON(API.config);
    tile('tMrr', c.mrr_eur != null ? `€${Number(c.mrr_eur).toLocaleString('ru-RU')} <small>/мес</small>` : '—',
         `<span>обновлено ${fmtDate(c.updated_at)}</span>`);
    tile('tClients', c.clients_live ?? '—', `<span>живых агентов · ${fmtDate(c.updated_at)}</span>`);
  } catch (e) { tile('tMrr', '—', noData('config.json')); tile('tClients', '—', noData('config.json')); }
}

async function loadLeads(){
  document.querySelectorAll('#region [data-r]').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === region));
  $('tLeads').href = '/dashboard/leads' + (region === 'all' ? '' : '?region=' + region);
  try {
    const d = await getLeads(new URLSearchParams({days: 7, region}));
    const k = d.kpi || {};
    tile('tLeads', k.today ?? '—',
      `<span>7 дней <b>${k.last7 ?? '—'}</b></span><span>крупные <b>${k.large7 ?? '—'}</b></span><span>срочные <b>${k.urgent7 ?? '—'}</b></span>`);
    const bs = k.by_source || {};
    $('leadsSrc').innerHTML = d.authorized
      ? `<span>Scout <b>${bs.scout?.last7 ?? 0}</b> · Fixando <b>${bs.fixando?.last7 ?? 0}</b> за 7 дн</span>`
      : `<span>Fixando <b>${bs.fixando?.last7 ?? 0}</b> за 7 дн · Scout недоступен</span>`;
    const p = (k.per_day || []).map(x => x.count), mx = Math.max(1, ...p);
    $('spark').innerHTML = p.length > 1 ? `<polyline fill="none" stroke="currentColor" stroke-width="2" points="${p.map((v,i)=>`${(i*120/(p.length-1)).toFixed(1)},${(26-v/mx*24).toFixed(1)}`).join(' ')}"/>` : '';
    const cs = d.competitors_summary || {};
    const top = Object.entries(cs.by_category || {})[0];
    tile('tComp', cs.total ?? '—', `<span>${top ? 'больше всего: ' + esc(top[0]) + ' (' + top[1] + ')' : 'профилей мастеров'}</span>`);
    const md = d.scout_last_macrodroid_run, h = hoursSince(md);
    tile('tScout', md ? fmtDate(md) : '—',
      md ? `<span class="${h > 48 ? 'bad-t' : ''}">последний прогон MacroDroid · ${ago(md)}${h > 48 ? ' — молчит больше 48 ч' : ''}</span>` : noData('нет поля в API'),
      h > 48);
  } catch (e) {
    tile('tLeads', '—', noData(e.message)); $('leadsSrc').innerHTML = '';
    tile('tScout', '—', noData(e.message));
  }
  try {
    const b = await getJSON(API.leadsPublic + '?competitors=1&category=__b2b__');
    const names = {al_manager:'AL', condo_admin:'кондоминиумы', relocation:'релокация'};
    tile('tB2b', b.count ?? '—', Object.entries(b.by_segment || {}).map(([k,v]) => `<span>${names[k]||esc(k)} <b>${v}</b></span>`).join('') || '<span>компании с телефонами</span>');
  } catch (e) { tile('tB2b', '—', noData()); }
}

async function loadTasks(){
  try {
    const d = await getJSON(API.board);
    const T = d.tasks || [], today = todayIso();
    const st = s => (s || '').toLowerCase();
    const n = pre => T.filter(t => st(t.status).startsWith(pre)).length;
    const overdue = T.filter(t => t.deadline && t.deadline.slice(0,10) < today && !st(t.status).startsWith('done')).length;
    tile('tTasks', n('active'), `<span>активные</span><span>ждут <b>${n('wait')}</b></span><span>готово <b>${n('done')}</b></span>`
      + (overdue ? `<span class="bad-t">просрочено ${overdue}</span>` : '<span>просроченных нет</span>'), overdue > 0);
  } catch (e) { tile('tTasks', '—', noData(e.message)); }
}

async function loadTech(){
  try {
    const d = await getJSON(API.dashboard);
    const t = d.tech || {}, C = t.containers || [];
    const down = C.filter(c => !c.running || c.oomkilled);
    const errs = +t.n8n_errors_24h || 0;
    const bad = down.length > 0;
    tile('tTech', bad ? `<span class="bad-t">${down.length} упало</span>` : `<span style="color:var(--ok)">всё работает</span>`,
      `<span><i class="dot ${bad?'err':'ok'}"></i> контейнеры ${C.length - down.length}/${C.length}</span>`
      + `<span><i class="dot ok"></i> VPS · диск ${esc(t.disk_pct || '—')}</span>`
      + `<span><i class="dot ${errs ? 'wait' : 'ok'}"></i> n8n ошибок за 24 ч: ${errs}</span>`
      + `<span><i class="dot"></i> ElevenLabs: нет данных</span>`, bad);
    $('upd').textContent = 'обновлено ' + ago(d.generated_at);
  } catch (e) { tile('tTech', '<span class="bad-t">VPS/n8n не отвечает</span>', noData(e.message), true); }
}

function loadAll(){ loadBusiness(); loadLeads(); loadTasks(); loadTech(); }
$('region').onclick = e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  region = b.dataset.r; store.set('lead_region', region); loadLeads();
};
$('refresh').onclick = loadAll;
loadAll();
</script>
</body>
</html>
