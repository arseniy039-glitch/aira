<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Лиды Aira Home · Aira</title>
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<header>
  <div class="top">
    <a class="back" href="/dashboard" aria-label="Назад на дашборд">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Лиды Aira Home</h1>
    <span class="upd" id="upd"></span>
  </div>
</header>
<nav class="seg" id="chipsRegion" role="group" aria-label="Регион"></nav>
<nav class="seg" id="chipsSource" role="group" aria-label="Источник"></nav>
<section class="kpis" id="kpis" aria-label="Сводка"></section>
<nav class="chips" id="chipsDir" aria-label="Направление"></nav>
<nav class="chips" id="chipsMore" aria-label="Фильтры">
  <select class="chip" id="fDays" aria-label="Период"><option value="1">Сегодня</option><option value="7" selected>7 дней</option><option value="30">30 дней</option></select>
  <select class="chip" id="fConc" aria-label="Район"><option value="">Все районы</option></select>
  <select class="chip" id="fStatus" aria-label="Статус"><option value="">Все статусы</option><option value="new">Новые</option><option value="taken">Взял</option><option value="skip">Пропущены</option><option value="won">Выиграли</option><option value="lost">Проиграли</option></select>
  <button class="chip" id="fHideFix" aria-pressed="false">Скрывать Fixando</button>
  <button class="chip" id="fLarge" aria-pressed="false">Только крупные</button>
  <button class="chip" id="fNow" aria-pressed="false">Только срочные</button>
</nav>
<main class="list" id="list" aria-live="polite"></main>

<script src="/dashboard/app.js"></script>
<script src="/dashboard/nav.js"></script>
<script>
const DIRS={airahome:'Airahome',construction:'Construction',energia:'Energia',garden:'Garden',other:'Другое'};
const REG={all:'Все',lisboa:'Лиссабон',algarve:'Алгарве'};
const SRC={all:'Все',scout:'Scout',fixando:'Fixando'};
const SUB={macrodroid:'MacroDroid (телефон)',http:'HTTP-скрапер',telegram:'Telegram-группы'};
const ST={new:'Новый',taken:'Взял',skip:'Пропущен',won:'Выиграли',lost:'Проиграли'};
let data=null, sources=[], f={dir:'',large:false,now:false};
const params=new URLSearchParams(location.search);
let region=params.get('region'); if(!REG[region]){region=store.get('lead_region','all');if(!REG[region])region='all'}
let source=params.get('source'); if(!SRC[source])source='all';
let hideFix=store.get('lead_hide_fixando','0')==='1';
const lastVisit=+store.get('lead_last_visit',0)||0;
// "Скрывать Fixando" narrows "Все" to Scout; an explicit Fixando choice still shows Fixando.
const effSource=()=>source==='all'&&hideFix?'scout':source;

async function load(){
  $('list').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const q=new URLSearchParams({days:$('fDays').value,region});
  if(effSource()!=='all')q.set('source',effSource());
  if($('fConc').value)q.set('concelho',$('fConc').value);
  if($('fStatus').value)q.set('status',$('fStatus').value);
  try{
    [data,sources]=await Promise.all([getLeads(q),getSources()]);render();
  }catch(e){$('list').innerHTML='<div class="err">Не удалось загрузить данные ('+esc(e.message)+').<br><button class="chip" onclick="load()">Повторить</button></div>'}
}
function segHtml(map,cur,counts,attr){
  return Object.keys(map).map(k=>{const n=counts[k];return `<button class="chip" data-${attr}="${k}" aria-pressed="${cur===k}">${map[k]}${n!=null?' · '+n:''}</button>`}).join('');
}
function render(){
  const k=data.kpi||{}, br=k.by_region||{}, bs=k.by_source||{};
  $('upd').textContent=data.generated_at?'обновлено '+ago(data.generated_at):'';
  const sum=o=>Object.values(o).reduce((a,v)=>a+(v.last7||0),0);
  $('chipsRegion').innerHTML=segHtml(REG,region,{all:sum(br),lisboa:br.lisboa?.last7,algarve:br.algarve?.last7},'region');
  $('chipsSource').innerHTML=segHtml(SRC,source,{all:sum(bs),scout:data.authorized?(bs.scout?.last7??0):null,fixando:bs.fixando?.last7},'source');
  $('fHideFix').setAttribute('aria-pressed',hideFix);
  $('kpis').innerHTML=[['Сегодня',k.today],['7 дней',k.last7],['Крупные',k.large7],['Срочные',k.urgent7]]
    .map(([l,v])=>`<div class="kpi"><b>${v??'—'}</b><span>${l}</span></div>`).join('');
  const bd=k.by_direction||{};
  $('chipsDir').innerHTML=[['','Все',k.last7]].concat(Object.keys(DIRS).map(d=>[d,DIRS[d],bd[d]||0]))
    .map(([d,l,n])=>`<button class="chip" data-dir="${d}" aria-pressed="${f.dir===d}">${l} · ${n??0}</button>`).join('');
  const conc=$('fConc'),cur=conc.value;
  if(conc.options.length<=1)Object.keys(k.by_concelho||{}).forEach(c=>conc.add(new Option(c,c)));
  conc.value=cur;
  let L=(data.leads||[]).filter(x=>(!f.dir||x.direction===f.dir)&&(!f.large||x.size==='large')&&(!f.now||x.urgency==='now'));
  const note=effSource()==='scout'&&!data.authorized
    ?'<div class="box warn">Scout-лиды отдаются только через защищённый прокси дашборда (ключ AIRA_LEADS_KEY в Cloudflare Pages). Сейчас ключа нет — видны только публичные данные Fixando.</div>':'';
  if(!L.length){$('list').innerHTML=note+'<div class="empty">Под эти фильтры заявок нет.</div>';return}
  $('list').innerHTML=note+L.map(x=>{
    const fresh=lastVisit&&new Date(x.first_seen_at)>lastVisit;
    const trusted=(sources.find(s=>s.id===x.source)||{}).trusted;
    const place=x.source==='scout'?`${esc(x.concelho)}${x.group_name?' · '+esc(x.group_name):''}`
      :`${esc(x.freguesia)} · ${esc(x.concelho)}${region==='all'&&x.region?' · '+REG[x.region]:''}`;
    return `<button class="lead${fresh?' fresh':''}${trusted?'':' muted'}" data-id="${esc(x.id)}">
      <div class="row">${srcBadge(sources,x.source)}<span class="dir d-${x.direction}">${DIRS[x.direction]||esc(x.direction)}</span>
      <span class="age">${ago(x.first_seen_at)}</span></div>
      <div class="place">${place}</div>
      <div class="txt">${esc(x.text_clean)}</div>
      <div class="row">${x.size==='large'?'<span class="tag t-large">Крупный</span>':''}${x.urgency==='now'?'<span class="tag t-now">Срочно</span>':''}
      <span class="tag t-st">${esc(x.subcategory||x.category)}</span>${x.status&&x.status!=='new'?`<span class="tag t-st">${ST[x.status]}</span>`:''}</div></button>`}).join('');
}
function sourceBox(x){
  if(x.source==='scout'){
    const link=x.url_page?`<a href="${esc(x.url_page)}" target="_blank" rel="noopener">${x.url_kind==='post'?'Открыть пост в FB':'Открыть группу в FB (ссылки на сам пост нет)'} →</a>`:'Ссылки на пост нет';
    return `<div class="box"><h3>Источник</h3>Aira Scout · ${esc(SUB[x.subsource]||x.subsource)}<br>Группа: ${esc(x.group_name||'—')}<br>${link}</div>`;
  }
  return `<div class="box warn"><h3>Источник</h3>Fixando (публичный тизер, контакт не проверен)<br><a href="${esc(x.url_page)}" target="_blank" rel="noopener">Исходная страница Fixando →</a></div>`;
}
function openLead(id){
  const x=(data.leads||[]).find(l=>l.id===id);if(!x)return;
  const mk=(data.market||[]).filter(m=>m.concelho===x.concelho&&(m.category===x.category||String(x.category).startsWith(m.category)));
  const cs=(data.competitors_summary||{}).total, scout=x.source==='scout';
  Sheet.open((DIRS[x.direction]||'Лид')+' · '+(scout?x.concelho:x.freguesia),`
    <div class="row">${srcBadge(sources,x.source)}${x.size==='large'?'<span class="tag t-large">Крупный</span>':''}${x.urgency==='now'?'<span class="tag t-now">Срочно</span>':''}</div>
    <p class="full">${esc(scout?(x.text_full||x.text_clean):x.text_clean)}</p>
    ${scout&&x.text_full&&x.text_clean!==x.text_full?`<div class="box"><h3>Кратко</h3>${esc(x.text_clean)}</div>`:''}
    <dl>
      <dt>Категория</dt><dd>${esc(x.subcategory||x.category)}</dd>
      <dt>Направление</dt><dd>${DIRS[x.direction]||esc(x.direction)}</dd>
      <dt>Район</dt><dd>${scout?esc(x.concelho)+(x.location_text?` <span class="place">(${esc(x.location_text)})</span>`:''):esc(x.freguesia)+', '+esc(x.concelho)}${x.region?' · '+REG[x.region]:''}</dd>
      <dt>${scout?'Замечен':'Опубликован'}</dt><dd>${fmtDate(x.published_date)}</dd>
      <dt>Увидели</dt><dd>${ago(x.first_seen_at)}</dd>
      <dt>Размер</dt><dd>${{small:'Мелкий',medium:'Средний',large:'Крупный'}[x.size]||esc(x.size)}</dd>
      ${scout?`<dt>Уверенность</dt><dd>${esc(x.confidence||'—')}</dd>`:''}
    </dl>
    ${sourceBox(x)}
    ${scout&&x.reply_draft?`<div class="box"><h3>Черновик ответа</h3><p style="white-space:pre-wrap">${esc(x.reply_draft)}</p></div><button class="btn" id="copyDraft">Копировать черновик</button>`:''}
    ${scout?'':`<div class="box"><h3>Рынок</h3>${x.price_hint?esc(x.price_hint):mk.length?mk.map(m=>`${esc(m.range_text)} / ${esc(m.unit)} (средн. ${m.avg_price}€)`).join('<br>'):'нет данных'}</div>
    <div class="box"><h3>Конкуренты</h3>${cs?`В базе ${cs} профилей мастеров. <a href="/dashboard/competitors?concelho=${encodeURIComponent(x.concelho)}">Смотреть в ${esc(x.concelho)} →</a>`:'нет данных'}</div>`}
    <div class="stbtns">${['taken','skip','won','lost'].map(s=>`<button class="btn" data-st="${s}" aria-pressed="${x.status===s}">${ST[s]}</button>`).join('')}</div>
    <textarea id="note" placeholder="Заметка">${esc(x.note||'')}</textarea>
    <div class="msg" id="stMsg"></div>`,x.id);
  Sheet.body().querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>setStatus(x,b.dataset.st));
  if($('copyDraft'))$('copyDraft').onclick=e=>copyText(x.reply_draft,e.target);
}
async function setStatus(x,st){
  const note=$('note').value;$('stMsg').textContent='Сохраняю…';
  try{const r=await fetch(API.leadStatus,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status:st,note})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||r.status);x.status=st;x.note=note;$('stMsg').textContent='Сохранено';
    Sheet.body().querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===st));render();
  }catch(e){$('stMsg').textContent='Не сохранилось ('+e.message+'). Попробуй ещё раз.'}
}
function setUrl(){
  const u=new URL(location.href);
  region==='all'?u.searchParams.delete('region'):u.searchParams.set('region',region);
  source==='all'?u.searchParams.delete('source'):u.searchParams.set('source',source);
  history.replaceState(history.state,'',u);
}
$('chipsRegion').onclick=e=>{const b=e.target.closest('[data-region]');if(!b||b.dataset.region===region)return;
  region=b.dataset.region;store.set('lead_region',region);setUrl();const c=$('fConc');c.value='';c.length=1;load()};
$('chipsSource').onclick=e=>{const b=e.target.closest('[data-source]');if(!b||b.dataset.source===source)return;
  source=b.dataset.source;setUrl();load()};
$('fHideFix').onclick=()=>{hideFix=!hideFix;store.set('lead_hide_fixando',hideFix?'1':'0');load()};
$('chipsDir').onclick=e=>{const b=e.target.closest('[data-dir]');if(!b)return;f.dir=b.dataset.dir;render()};
$('list').onclick=e=>{const b=e.target.closest('.lead');if(b)openLead(b.dataset.id)};
['fDays','fConc','fStatus'].forEach(i=>$(i).onchange=load);
$('fLarge').onclick=function(){f.large=!f.large;this.setAttribute('aria-pressed',f.large);render()};
$('fNow').onclick=function(){f.now=!f.now;this.setAttribute('aria-pressed',f.now);render()};
window.addEventListener('pagehide',()=>store.set('lead_last_visit',Date.now()));
load();
</script>
</body>
</html>
