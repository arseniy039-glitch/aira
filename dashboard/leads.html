<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Лиды Aira Home · Aira</title>
<link rel="stylesheet" href="/dashboard/app.css">
<style>
/* 03.11.2026 Scout Португалия: плитки регионов */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 16px 0;max-width:880px;margin:0 auto}
@media (min-width:600px){.tiles{grid-template-columns:repeat(7,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0;border-left-width:5px}
.tile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.c-red{border-left-color:var(--red);background:var(--red-bg)}.tile.c-yellow{border-left-color:var(--warn)}.tile.c-green{border-left-color:var(--ok)}
.tile[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-1px}
.lead{cursor:default}
.lead .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.qst{display:flex;gap:6px;flex-wrap:wrap}
.qst .chip{min-height:32px;font-size:13px;padding:0 10px}
.tag.t-de{background:var(--acc-bg);color:var(--acc);font-weight:700}
.tag.t-hot{background:var(--red-bg);color:var(--red);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="back" href="/dashboard" aria-label="Назад на дашборд">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Лиды · Португалия</h1>
    <span class="upd" id="upd"></span>
  </div>
</header>
<section class="tiles" id="tiles" aria-label="Регионы"></section>
<section class="kpis" id="kpis" aria-label="Сводка"></section>
<nav class="chips" id="chipsDir" aria-label="Направление"></nav>
<nav class="chips" id="chipsMore" aria-label="Фильтры">
  <button class="chip" id="fHot" aria-pressed="false">🔴 Горячие</button>
  <button class="chip" id="fNow" aria-pressed="false">Срочно</button>
  <button class="chip" id="fDe" aria-pressed="false">🇩🇪 Вилли</button>
  <select class="chip" id="fSize" aria-label="Объём"><option value="">Любой объём</option><option value="medium">Средний</option><option value="large">Крупный</option></select>
  <select class="chip" id="fSvc" aria-label="Услуга"><option value="">Все услуги</option></select>
  <select class="chip" id="fStatus" aria-label="Статус"><option value="">Все статусы</option><option value="new">Новые</option><option value="taken">В работе</option><option value="skip">Не лид</option><option value="commented">Закоммичен</option><option value="won">Выиграли</option><option value="lost">Проиграли</option></select>
  <select class="chip" id="fSub" aria-label="Источник"><option value="">FB + Telegram</option><option value="fb">FB</option><option value="telegram">Telegram</option></select>
  <select class="chip" id="fDays" aria-label="Период"><option value="1">Сегодня</option><option value="7" selected>7 дней</option><option value="30">30 дней</option></select>
  <select class="chip" id="fConc" aria-label="Место"><option value="">Все места</option></select>
</nav>
<main class="list" id="list" aria-live="polite"></main>

<script src="/dashboard/app.js"></script>
<script src="/dashboard/nav.js"></script>
<script>
const DIRS={airahome:'Airahome',construction:'Construction',energia:'Energia',garden:'Garden',other:'Другое'};
const REG={all:'Все',algarve:'Алгарве',lisboa:'Лиссабон',norte:'Порту/Север',centro:'Центр',alentejo:'Алентежу',ilhas:'Острова'};
const SUB={macrodroid:'MacroDroid (телефон)',http:'HTTP-скрапер',desktop:'Scout Desktop',telegram:'Telegram-группы'};
const ST={new:'Новый',taken:'В работе',skip:'Не лид',won:'Выиграли',lost:'Проиграли',commented:'Закоммичен'};
const TL={now:'срочно',weeks:'в течение месяца',months:'через месяцы',unknown:''};
let data=null, sources=[], f={dir:'',hot:false,now:false,de:false};
const params=new URLSearchParams(location.search);
let region=params.get('region'); if(!REG[region]){region=store.get('lead_region','all');if(!REG[region])region='all'}
const lastVisit=+store.get('lead_last_visit',0)||0;

async function load(){
  $('list').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const q=new URLSearchParams({days:$('fDays').value,region,source:'scout'});  // Fixando скрыт (03.11.2026)
  if($('fConc').value)q.set('concelho',$('fConc').value);
  if($('fStatus').value)q.set('status',$('fStatus').value);
  try{
    [data,sources]=await Promise.all([getLeads(q),getSources()]);render();
  }catch(e){$('list').innerHTML='<div class="err">Не удалось загрузить данные ('+esc(e.message)+').<br><button class="chip" onclick="load()">Повторить</button></div>'}
}
function tilesHtml(t){
  const all={total:0,new:0,hot_new:0,de:0};Object.values(t).forEach(v=>{for(const k in all)all[k]+=v[k]||0});
  return Object.keys(REG).map(r=>{const v=r==='all'?all:(t[r]||{total:0,new:0,hot_new:0,de:0});
    const c=v.hot_new?'c-red':v.new?'c-yellow':'c-green';
    return `<button class="tile ${c}" data-region="${r}" aria-pressed="${region===r}"><b>${REG[r]}</b><span>🔴 ${v.hot_new} · нов ${v.new}</span><span>🇩🇪 ${v.de} · всего ${v.total}</span></button>`}).join('');
}
const isFb=x=>x.subsource!=='telegram';
function render(){
  const k=data.kpi||{};
  $('upd').textContent=data.generated_at?'обновлено '+ago(data.generated_at):'';
  $('tiles').innerHTML=tilesHtml(k.tiles||{});
  $('kpis').innerHTML=[['Сегодня',k.today],['7 дней',k.last7],['Крупные',k.large7],['Срочные',k.urgent7]]
    .map(([l,v])=>`<div class="kpi"><b>${v??'—'}</b><span>${l}</span></div>`).join('');
  const bd=k.by_direction||{};
  $('chipsDir').innerHTML=[['','Все',k.last7]].concat(Object.keys(DIRS).map(d=>[d,DIRS[d],bd[d]||0]))
    .map(([d,l,n])=>`<button class="chip" data-dir="${d}" aria-pressed="${f.dir===d}">${l} · ${n??0}</button>`).join('');
  const conc=$('fConc'),cur=conc.value;
  if(conc.options.length<=1)Object.keys(k.by_concelho||{}).forEach(c=>conc.add(new Option(c,c)));
  conc.value=cur;
  const svc=$('fSvc'),cs=svc.value;
  if(svc.options.length<=1)[...new Set((data.leads||[]).map(x=>x.subcategory||x.category).filter(Boolean))].sort().forEach(s=>svc.add(new Option(s,s)));
  svc.value=cs;
  const sz=$('fSize').value, sub=$('fSub').value;
  let L=(data.leads||[]).filter(x=>(!f.dir||x.direction===f.dir)&&(!f.hot||x.color==='red')&&(!f.now||x.timeline==='now'||x.urgency==='now')
    &&(!f.de||x.de_vip)&&(!sz||x.size===sz)&&(!cs||(x.subcategory||x.category)===cs)&&(!sub||(sub==='telegram')!==isFb(x)));
  const note=!data.authorized
    ?'<div class="box warn">Scout-лиды отдаются только через защищённый прокси дашборда (ключ AIRA_LEADS_KEY в Cloudflare Pages). Сейчас ключа нет.</div>':'';
  if(!L.length){$('list').innerHTML=note+'<div class="empty">Под эти фильтры заявок нет.</div>';return}
  $('list').innerHTML=note+L.map(x=>{
    const fresh=lastVisit&&new Date(x.first_seen_at)>lastVisit;
    const km=x.distance_km&&x.region!=='algarve'?` (~${x.distance_km} км)`:'';
    const place=`${esc(x.concelho)}${km}${region==='all'?' · '+(REG[x.region]||''):''}${x.group_name?' · '+esc(x.group_name):''}`;
    const st=x.status||'new';
    return `<div class="lead${fresh?' fresh':''}" data-id="${esc(x.id)}">
      <button class="open" data-open="${esc(x.id)}">
      <div class="row">${x.color==='red'?'<span class="tag t-hot">🔴</span>':''}<span class="dir d-${x.direction}">${DIRS[x.direction]||esc(x.direction)}</span>
      ${x.de_vip?'<span class="tag t-de">🇩🇪 Вилли</span>':''}<span class="age">${ago(x.first_seen_at)}</span></div>
      <div class="place">${place}</div>
      ${x.title_ru?`<div><b>${esc(x.title_ru)}</b></div>`:''}
      <div class="txt">${esc(x.gist_ru||x.text_clean)}</div>
      <div class="row">${x.size==='large'?'<span class="tag t-large">Крупный</span>':''}${TL[x.timeline]?`<span class="tag t-now">${TL[x.timeline]}</span>`:''}
      <span class="tag t-st">${esc(x.subcategory||x.category)}</span>${st!=='new'?`<span class="tag t-st">${ST[st]||esc(st)}</span>`:''}</div></button>
      <div class="qst">${x.url_page?`<a class="chip" href="${esc(x.url_page)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">🔗 Пост</a>`:''}
      ${['taken','skip'].map(s=>`<button class="chip" data-qst="${s}" data-id="${esc(x.id)}" aria-pressed="${st===s}">${s==='taken'?'✔️ В работу':'🚫 Не лид'}</button>`).join('')}</div></div>`}).join('');
}
function sourceBox(x){
  const link=x.url_page?`<a href="${esc(x.url_page)}" target="_blank" rel="noopener">${x.url_kind==='post'?'Открыть пост в FB':'Открыть группу в FB (ссылки на сам пост нет)'} →</a>`:'Ссылки на пост нет';
  return `<div class="box"><h3>Источник</h3>Aira Scout · ${esc(SUB[x.subsource]||x.subsource)}<br>Группа: ${esc(x.group_name||'—')}<br>${link}</div>`;
}
function openLead(id){
  const x=(data.leads||[]).find(l=>l.id===id);if(!x)return;
  const km=x.distance_km&&x.region!=='algarve'?` (~${x.distance_km} км от Лиссабона)`:'';
  Sheet.open((x.title_ru||DIRS[x.direction]||'Лид')+' · '+x.concelho,`
    <div class="row">${x.color==='red'?'<span class="tag t-hot">🔴 горячий</span>':''}${x.de_vip?'<span class="tag t-de">🇩🇪 Вилли</span>':''}${x.size==='large'?'<span class="tag t-large">Крупный</span>':''}${TL[x.timeline]?`<span class="tag t-now">${TL[x.timeline]}</span>`:''}</div>
    ${x.gist_ru?`<div class="box"><h3>Суть</h3>${esc(x.gist_ru)}</div>`:''}
    <p class="full">${esc(x.text_full||x.text_clean)}</p>
    <dl>
      <dt>Услуга</dt><dd>${esc(x.subcategory||x.category)}</dd>
      ${x.seeking?`<dt>Ищут</dt><dd>${esc(x.seeking)}</dd>`:''}
      <dt>Место</dt><dd>${esc(x.concelho)}${km}${x.region?' · '+REG[x.region]:''}${x.location_text?` <span class="place">(${esc(x.location_text)})</span>`:''}</dd>
      <dt>Замечен</dt><dd>${fmtDate(x.published_date)} · ${ago(x.first_seen_at)}</dd>
      <dt>Размер</dt><dd>${{small:'Мелкий',medium:'Средний',large:'Крупный'}[x.size]||esc(x.size)}</dd>
      <dt>Уверенность</dt><dd>${esc(x.confidence||'—')}</dd>
    </dl>
    ${sourceBox(x)}
    ${x.reply_draft?`<div class="box"><h3>Комментарий</h3><p style="white-space:pre-wrap">${esc(x.reply_draft)}</p></div><button class="btn" id="copyDraft">Копировать комментарий</button>`:''}
    <div class="stbtns">${['taken','skip','won','lost'].map(s=>`<button class="btn" data-st="${s}" aria-pressed="${x.status===s}">${ST[s]}</button>`).join('')}</div>
    <textarea id="note" placeholder="Заметка">${esc(x.note||'')}</textarea>
    <div class="msg" id="stMsg"></div>`,x.id);
  Sheet.body().querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>setStatus(x,b.dataset.st));
  if($('copyDraft'))$('copyDraft').onclick=e=>copyText(x.reply_draft,e.target);
}
async function postStatus(x,st,note){
  const r=await fetch(API.leadStatus,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status:st,note})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok)throw new Error(j.error||r.status);x.status=st;if(note!=null)x.note=note;
}
async function setStatus(x,st){
  const note=$('note').value;$('stMsg').textContent='Сохраняю…';
  try{await postStatus(x,st,note);$('stMsg').textContent='Сохранено';
    Sheet.body().querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===st));render();
  }catch(e){$('stMsg').textContent='Не сохранилось ('+e.message+'). Попробуй ещё раз.'}
}
function setUrl(){
  const u=new URL(location.href);
  region==='all'?u.searchParams.delete('region'):u.searchParams.set('region',region);
  history.replaceState(history.state,'',u);
}
$('tiles').onclick=e=>{const b=e.target.closest('[data-region]');if(!b||b.dataset.region===region)return;
  region=b.dataset.region;store.set('lead_region',region);setUrl();const c=$('fConc');c.value='';c.length=1;load()};
$('chipsDir').onclick=e=>{const b=e.target.closest('[data-dir]');if(!b)return;f.dir=b.dataset.dir;render()};
$('list').onclick=async e=>{
  const q=e.target.closest('[data-qst]');
  if(q){const x=(data.leads||[]).find(l=>l.id===q.dataset.id);if(!x)return;q.disabled=true;
    try{await postStatus(x,q.dataset.qst===x.status?'new':q.dataset.qst,null);render()}catch(err){q.disabled=false;q.textContent='ошибка, ещё раз'}return}
  const b=e.target.closest('[data-open]');if(b)openLead(b.dataset.open)};
['fDays','fConc','fStatus'].forEach(i=>$(i).onchange=load);
['fSize','fSvc','fSub'].forEach(i=>$(i).onchange=render);
[['fHot','hot'],['fNow','now'],['fDe','de']].forEach(([id,key])=>$(id).onclick=function(){f[key]=!f[key];this.setAttribute('aria-pressed',f[key]);render()});
window.addEventListener('pagehide',()=>store.set('lead_last_visit',Date.now()));
load();
</script>
</body>
</html>
