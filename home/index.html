.photo-frame img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(var(--photo-sat)) contrast(var(--photo-con));}
.photo-frame .photo-veil{position:absolute;inset:0;mix-blend-mode:multiply;}

/* ── NAV ── */

.nav-mid{display:flex;align-items:center;gap:1rem;flex-wrap:nowrap;}
.nav-phone{display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:0.88rem;white-space:nowrap;}
.lang-switch{display:flex;gap:0.15rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.2rem;flex-shrink:0;}
.lang-btn{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600;letter-spacing:0.03em;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:0.35rem 0.55rem;border-radius:var(--radius-pill);transition:background 0.2s,color 0.2s;}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.reveal{opacity:1;transform:none;}}

let currentLang = 'en';
function setLang(lang){
  if(!T[lang]) return;
  currentLang = lang;
  const t = T[lang];
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.documentElement.lang = lang;
}

(function(){
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
})();

setLang('en');
</script>
