<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Тоби — ИИ-репетитор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --bg2: var(--tg-theme-secondary-bg-color, #181b22);
    --text: var(--tg-theme-text-color, #f2f3f5);
    --hint: var(--tg-theme-hint-color, #8b919c);
    --accent: var(--tg-theme-button-color, #6c5ce7);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #ff5a5f);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  header { text-align: center; margin-top: 4px; }
  header h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--hint); font-size: 14px; max-width: 320px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 22px; }
  .stage { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 30px; border-radius: 50%; background: var(--accent); opacity: 0; transform: scale(1); transition: transform .08s linear, opacity .3s; }
  .ring.r2 { inset: 30px; }
  .live .ring { opacity: .18; }
  .live .ring.r2 { opacity: .10; }
  .connecting .ring { opacity: .15; animation: pulse 1.2s ease-in-out infinite; }
  .connecting .ring.r2 { animation-delay: .4s; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  #mic {
    position: relative; z-index: 2; width: 150px; height: 150px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .15s;
  }
  #mic:active { transform: scale(.96); }
  #mic:disabled { opacity: .6; }
  #mic svg { width: 96px; height: 96px; }
  .speaking #mic { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent), 0 10px 30px rgba(0,0,0,.25); }
  .wave { display: flex; gap: 4px; align-items: center; height: 28px; }
  .wave i { display: block; width: 4px; height: 6px; border-radius: 2px; background: var(--accent); opacity: .35; transition: height .08s linear, opacity .2s; }
  .live .wave i { opacity: .9; }
  #status { font-size: 18px; font-weight: 600; min-height: 26px; text-align: center; }
  #timer { font-variant-numeric: tabular-nums; color: var(--hint); font-size: 15px; min-height: 20px; }
  #timer.low { color: var(--danger); font-weight: 600; }
  .btn {
    appearance: none; border: 0; border-radius: 12px; padding: 14px 18px; font: inherit; font-weight: 600; cursor: pointer;
    width: 100%; max-width: 340px; background: var(--bg2); color: var(--text);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn[hidden] { display: none; }
  .panel {
    width: 100%; max-width: 360px; background: var(--bg2); border-radius: 14px; padding: 16px; font-size: 15px;
  }
  .panel[hidden] { display: none; }
  .panel h2 { font-size: 17px; margin: 0 0 8px; }
  .panel ol { margin: 8px 0 0; padding-left: 20px; }
  .panel li { margin: 4px 0; }
  .muted { color: var(--hint); font-size: 13px; text-align: center; max-width: 320px; }
  footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>Тоби — ИИ-репетитор английского</h1>
  <p>До 5 минут живой практики: кафе, аэропорт, собеседование или просто болтовня</p>
</header>

<main id="main">
  <div class="stage" id="stage">
    <div class="ring r2" id="ring2"></div>
    <div class="ring" id="ring1"></div>
    <button id="mic" aria-label="mic">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="18" cy="15" r="8" fill="currentColor" opacity=".9"/><circle cx="46" cy="15" r="8" fill="currentColor" opacity=".9"/>
        <circle cx="32" cy="35" r="22" fill="currentColor"/>
        <circle cx="24" cy="32" r="3.2" fill="var(--accent)"/><circle cx="40" cy="32" r="3.2" fill="var(--accent)"/>
        <path d="M24 43 q8 7 16 0" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="wave" id="wave"></div>
  <div id="status">Нажмите на Тоби, чтобы начать урок</div>
  <div id="timer">5:00</div>

  <div class="panel" id="panel" hidden></div>
</main>

<footer>
  <button class="btn" id="endBtn" hidden>Закончить урок</button>
  <div class="muted" id="note">Урок — до 5 минут, до 15 минут в день. Тоби — ИИ, разговор обрабатывается ИИ.</div>
</footer>

<script type="module">
import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.33.0/+esm';

const API = 'https://n8n.aira-ai.net/webhook/tg-tutor-session';
const BOT = 'https://t.me/aira_voice_demo_bot?start=tutor';
const WARN_AT = 25;
let LIMIT = 300;
const tg = window.Telegram && window.Telegram.WebApp;

const T = {
  idle: 'Нажмите на Тоби, чтобы начать урок', connecting: 'Подключаюсь…', listening: 'Слушаю', speaking: 'Тоби говорит', ended: 'Урок окончен',
  close: 'Закрыть',
  thanks: 'Отличная работа! Через пару минут Тоби пришлёт в чат голосовое с итогами урока.',
  micTitle: 'Нужен доступ к микрофону',
  micIos: ['Откройте «Настройки» iPhone → Telegram', 'Включите «Микрофон»', 'Вернитесь сюда и нажмите ещё раз'],
  micAndroid: ['Настройки телефона → Приложения → Telegram → Разрешения', 'Разрешите «Микрофон»', 'Вернитесь сюда и нажмите ещё раз'],
  daily_limit: 'На сегодня 15 минут практики закончились — вы молодец! Возвращайтесь завтра, Тоби будет ждать.',
  busy: 'Сейчас Тоби занят с другими учениками. Попробуйте через пару минут.',
  month_limit: 'Уроки временно недоступны. Попробуйте позже.',
  demo_off: 'Уроки временно недоступны. Попробуйте позже.',
  upstream: 'Не удалось подключиться. Попробуйте ещё раз через минуту.',
  auth: 'Сессия устарела. Закройте и откройте мини-приложение заново.',
  outside: 'Урок работает внутри Telegram. Откройте бота:', openBot: 'Открыть урок в Telegram',
  ctx: 'До конца урока осталось 25 секунд. Коротко заверши сцену, похвали ученика за конкретное, скажи, что итоги урока придут голосовым сообщением в чат, и попрощайся.',
};
const t = (k) => T[k];
document.documentElement.lang = 'ru';

const $ = (id) => document.getElementById(id);
const stage = $('stage'), mic = $('mic'), statusEl = $('status'), timerEl = $('timer'), panel = $('panel');
const endBtn = $('endBtn'), note = $('note'), wave = $('wave');
const BARS = 9; for (let i = 0; i < BARS; i++) wave.appendChild(document.createElement('i'));
const bars = [...wave.children];

let conv = null, state = 'idle', startedAt = 0, tick = null, raf = null, warned = false, ending = false;

if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('bg_color'); tg.setBackgroundColor('bg_color'); } catch (e) {}
}
const haptic = (kind) => { try { tg && tg.HapticFeedback && (kind === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred(kind || 'medium')); } catch (e) {} };

function setState(s) {
  state = s;
  stage.className = 'stage' + (s === 'connecting' ? ' connecting' : '') + (s === 'listening' || s === 'speaking' ? ' live' : '') + (s === 'speaking' ? ' speaking' : '');
  statusEl.textContent = t(s === 'error' ? 'ended' : s);
  endBtn.hidden = !(s === 'connecting' || s === 'listening' || s === 'speaking');
  mic.disabled = s === 'connecting';
}
function showPanel(html) { panel.innerHTML = html; panel.hidden = !html; }
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s) => Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');

function micHelp() {
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (tg && tg.platform === 'ios');
  const steps = t(ios ? 'micIos' : 'micAndroid');
  showPanel('<h2>🎙 ' + esc(t('micTitle')) + '</h2><ol>' + steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>');
}

async function post(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ initData: tg.initData }, body || {})) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 403) j.reason = j.reason || 'auth';
  return j;
}

function limitScreen(reason) {
  setState('idle'); statusEl.textContent = '';
  showPanel('<p style="margin:0">' + esc(t(reason)) + '</p>');
  mic.disabled = reason !== 'busy'; timerEl.textContent = '';
}

async function start() {
  if (state !== 'idle' && state !== 'ended') return;
  haptic('medium'); showPanel(''); warned = false; ending = false;
  setState('connecting');
  // 1. Микрофон — до запроса сессии, чтобы не сжечь лимит
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(tr => tr.stop());
  } catch (e) { setState('idle'); micHelp(); return; }
  // 2. Токен с бэкенда (ключ ElevenLabs остаётся на сервере), сервер же считает дневной остаток
  let sess;
  try { sess = await post(); } catch (e) { sess = { reason: 'upstream_error' }; }
  if (!sess.ok) {
    if (['daily_limit', 'busy', 'month_limit', 'demo_off'].includes(sess.reason)) return limitScreen(sess.reason);
    setState('idle'); showPanel('<p style="margin:0">' + esc(t(sess.reason === 'auth' || /signature|stale|init/.test(sess.reason || '') ? 'auth' : 'upstream')) + '</p>');
    return;
  }
  LIMIT = Math.max(30, Math.min(300, Number(sess.maxSeconds) || 300));
  // 3. WebRTC-сессия
  try {
    conv = await Conversation.startSession({
      conversationToken: sess.conversationToken,
      connectionType: 'webrtc',
      dynamicVariables: sess.dynamicVariables,
      onConnect: () => { startedAt = Date.now(); runTimer(); setState('listening'); try { tg.enableClosingConfirmation(); } catch (e) {} },
      onModeChange: ({ mode }) => { if (state !== 'ended') setState(mode === 'speaking' ? 'speaking' : 'listening'); },
      onDisconnect: () => finish(),
      onError: (msg) => { console.warn('conv error', msg); },
    });
    loop();
  } catch (e) {
    console.warn(e);
    conv = null;
    if (e && /permission|notallowed|denied/i.test(String(e.name || e.message || e))) { setState('idle'); micHelp(); }
    else { setState('idle'); showPanel('<p style="margin:0">' + esc(t('upstream')) + '</p>'); }
  }
}

function runTimer() {
  clearInterval(tick);
  const upd = () => {
    const left = LIMIT - Math.floor((Date.now() - startedAt) / 1000);
    timerEl.textContent = fmt(left);
    timerEl.classList.toggle('low', left <= WARN_AT);
    if (left <= WARN_AT && !warned && conv) { warned = true; try { conv.sendContextualUpdate(T.ctx); } catch (e) {} haptic('light'); }
    if (left <= -5) stop();   // страховка: агент обрывает на 300 с, клиент — по дневному остатку
  };
  upd(); tick = setInterval(upd, 500);
}

function loop() {
  cancelAnimationFrame(raf);
  const r1 = $('ring1'), r2 = $('ring2');
  const step = () => {
    if (!conv) return;
    let v = 0;
    try { v = state === 'speaking' ? conv.getOutputVolume() : conv.getInputVolume(); } catch (e) {}
    v = Math.min(1, Math.max(0, v * 2.2));
    r1.style.transform = 'scale(' + (1 + v * 0.35) + ')';
    r2.style.transform = 'scale(' + (1 + v * 0.6) + ')';
    const now = performance.now() / 180;
    bars.forEach((b, i) => { const k = 0.45 + 0.55 * Math.abs(Math.sin(now + i * 0.9)); b.style.height = (6 + v * 26 * k) + 'px'; });
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

async function stop() {
  if (!conv || ending) return;
  ending = true; haptic('light');
  try { await conv.endSession(); } catch (e) {}
  finish();
}

function finish() {
  if (state === 'ended') return;
  clearInterval(tick); cancelAnimationFrame(raf); conv = null;
  bars.forEach(b => { b.style.height = '6px'; });
  try { tg.disableClosingConfirmation(); } catch (e) {}
  setState('ended'); haptic('ok');
  timerEl.textContent = ''; timerEl.classList.remove('low');
  showPanel('<p style="margin:0">' + esc(t('thanks')) + '</p>');
  mic.disabled = false;
  if (tg && tg.MainButton) { tg.MainButton.setText(t('close')); tg.MainButton.show(); }
}

mic.addEventListener('click', () => { (state === 'listening' || state === 'speaking') ? stop() : start(); });
endBtn.addEventListener('click', stop);
if (tg && tg.MainButton) tg.MainButton.onClick(() => tg.close());

// Открыто вне Telegram — подписи initData нет, сессию не получить
if (!tg || !tg.initData) {
  mic.disabled = true; statusEl.textContent = ''; timerEl.textContent = '';
  showPanel('<p style="margin:0 0 12px">' + esc(t('outside')) + '</p><a class="btn primary" style="display:block;text-align:center;text-decoration:none" href="' + BOT + '">' + esc(t('openBot')) + '</a>');
}
</script>
</body>
</html>
