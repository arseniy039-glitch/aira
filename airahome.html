<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airahome — 24/7 Emergency Callout, Algarve</title>
<meta name="description" content="Something broke at your Algarve home? We answer in your language, quote a price on the spot, and have someone at your door in 2–3 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6;--surface:#ffffff;
  --ink:#14181c;--ink-dim:#4b5158;--ink-muted:#868c93;
  --line:rgba(20,24,28,0.10);--line-strong:rgba(20,24,28,0.22);
  --accent:#e2501c;--accent-dark:#c4410f;--accent-soft:rgba(226,80,28,0.10);--accent-soft-strong:rgba(226,80,28,0.18);
  --radius:8px;--radius-pill:999px;
  --nav-h:72px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;color:var(--ink);}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}
.section-inner{max-width:1120px;margin:0 auto;padding:0 1.75rem;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent-dark);font-weight:600;margin-bottom:0.9rem;display:block;}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.75rem;background:rgba(250,249,246,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);gap:1rem;}
.nav-logo{font-weight:800;font-size:1.15rem;letter-spacing:-0.01em;text-decoration:none;color:var(--ink);flex-shrink:0;}
.nav-logo span{color:var(--accent);}
.nav-mid{display:flex;align-items:center;gap:1.1rem;flex-wrap:nowrap;}
.nav-phone{display:flex;align-items:center;gap:0.55rem;text-decoration:none;color:var(--ink);}
.nav-phone-num{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:0.92rem;white-space:nowrap;}
.badge-247{font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:700;letter-spacing:0.05em;color:var(--accent-dark);background:var(--accent-soft);border-radius:var(--radius-pill);padding:0.2rem 0.5rem;}
.lang-badges{display:flex;gap:0.3rem;}
.lang-badge{font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:600;letter-spacing:0.03em;color:var(--ink-dim);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.15rem 0.45rem;}
.lang-switch{display:flex;gap:0.15rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.2rem;flex-shrink:0;}
.lang-btn{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600;letter-spacing:0.03em;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:0.35rem 0.55rem;border-radius:var(--radius-pill);transition:background 0.2s,color 0.2s;}
.lang-btn.active{background:var(--ink);color:#fff;}
.lang-btn:hover:not(.active){color:var(--ink);}
.nav-cta{font-weight:600;font-size:0.85rem;text-decoration:none;color:#fff;background:var(--ink);border-radius:var(--radius);padding:0.6rem 1.1rem;white-space:nowrap;transition:background 0.2s;flex-shrink:0;}
.nav-cta:hover{background:var(--accent-dark);}
@media(max-width:980px){.nav-mid .lang-badges{display:none;}}
@media(max-width:820px){.nav-cta{display:none;}.nav-phone-num{display:none;}}
@media(max-width:640px){.badge-247{display:none;}}

/* ── HERO ── */
#hero{padding:4rem 0 3.5rem;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);border-bottom:1px solid var(--line);}
.hero-grid{display:flex;flex-direction:column;align-items:flex-start;gap:1.4rem;max-width:760px;}
.hero-title{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.08;}
.hero-sub{font-size:clamp(1.05rem,2vw,1.2rem);color:var(--ink-dim);font-weight:400;max-width:640px;line-height:1.55;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:0.85rem;margin-top:0.4rem;}
.btn{display:inline-flex;align-items:center;gap:0.55rem;text-decoration:none;border-radius:var(--radius);padding:0.9rem 1.4rem;font-weight:600;font-size:0.95rem;cursor:pointer;border:1px solid transparent;transition:transform 0.15s,background 0.2s,border-color 0.2s;line-height:1.3;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary .num{font-family:'JetBrains Mono',monospace;font-weight:600;opacity:0.92;}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);}
.btn-secondary:hover{border-color:var(--ink);}
.hero-micro{font-size:0.85rem;color:var(--ink-muted);margin-top:0.2rem;}
.hero-langs{display:flex;align-items:center;gap:0.6rem;margin-top:0.2rem;}
.hero-langs .lang-badge{font-size:0.65rem;padding:0.22rem 0.55rem;}

/* ── FORM ── */
#request{padding:3.5rem 0;background:var(--surface);border-bottom:1px solid var(--line);}
.form-panel{background:var(--bg);border:1px solid var(--line-strong);border-radius:calc(var(--radius) * 2);padding:2.2rem;}
.form-heading{font-size:clamp(1.4rem,2.6vw,1.8rem);margin-bottom:0.4rem;}
.form-desc{color:var(--ink-dim);font-size:0.92rem;margin-bottom:1.6rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem;}
.form-field{display:flex;flex-direction:column;gap:0.4rem;}
.form-field.full{grid-column:1 / -1;}
.form-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);}
.form-input{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:0.75rem 0.9rem;font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);outline:none;transition:border-color 0.2s;width:100%;}
.form-input::placeholder{color:var(--ink-muted);}
.form-input:focus{border-color:var(--accent);}
textarea.form-input{resize:vertical;min-height:90px;}
.urgency-group{display:flex;gap:0.6rem;flex-wrap:wrap;}
.urgency-opt{position:relative;}
.urgency-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;}
.urgency-label{display:block;font-size:0.85rem;font-weight:500;padding:0.65rem 1.1rem;border:1px solid var(--line-strong);border-radius:var(--radius-pill);color:var(--ink-dim);cursor:pointer;transition:all 0.15s;}
.urgency-opt input:checked + .urgency-label{background:var(--ink);border-color:var(--ink);color:#fff;}
.form-submit{margin-top:1.6rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:0.9rem 1.8rem;font-weight:600;font-size:0.95rem;cursor:pointer;transition:background 0.2s;}
.form-submit:hover{background:var(--accent-dark);}
.form-submit:disabled{opacity:0.6;cursor:default;}
.form-status{font-size:0.85rem;margin-top:1rem;min-height:1.2em;}
.form-status.ok{color:#1a7a3c;}
.form-status.err{color:var(--accent-dark);}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.form-panel{padding:1.5rem;}}

/* ── HOW IT WORKS ── */
#how{padding:5rem 0;}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem;margin-top:2.5rem;}
.how-step{border-top:2px solid var(--ink);padding-top:1.2rem;}
.how-num{font-family:'JetBrains Mono',monospace;font-size:0.75rem;font-weight:700;color:var(--accent-dark);margin-bottom:0.8rem;}
.how-title{font-size:1.15rem;margin-bottom:0.5rem;}
.how-desc{font-size:0.9rem;color:var(--ink-dim);line-height:1.6;}
@media(max-width:820px){.how-grid{grid-template-columns:1fr;gap:2rem;}}

/* ── WHAT WE FIX ── */
#fix{padding:5rem 0;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.fix-head{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:2.5rem;max-width:640px;}
.fix-sub{color:var(--ink-dim);font-size:0.95rem;}
.fix-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.fix-tile{background:var(--bg);padding:1.8rem 1.6rem;display:flex;flex-direction:column;gap:0.8rem;transition:background 0.2s;}
.fix-tile:hover{background:var(--accent-soft);}
.fix-icon{width:30px;height:30px;color:var(--accent-dark);}
.fix-name{font-weight:600;font-size:1rem;}
.fix-desc{font-size:0.83rem;color:var(--ink-dim);line-height:1.5;}
@media(max-width:820px){.fix-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.fix-grid{grid-template-columns:1fr;}}

/* ── PRICING ── */
#pricing{padding:5rem 0;}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-top:2.5rem;}
.plan{background:var(--surface);border:1px solid var(--line-strong);border-radius:calc(var(--radius) * 1.5);padding:2rem 1.6rem;display:flex;flex-direction:column;}
.plan.featured{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.plan-name{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:0.3rem;}
.plan-sub{font-size:0.78rem;color:var(--ink-muted);margin-bottom:1.2rem;}
.plan-price{font-size:2.4rem;font-weight:800;letter-spacing:-0.02em;line-height:1;}
.plan-period{font-size:0.82rem;color:var(--ink-dim);margin-top:0.4rem;margin-bottom:1.3rem;}
.plan-desc{font-size:0.88rem;color:var(--ink-dim);line-height:1.6;flex:1;}
.pricing-note{margin-top:1.8rem;font-size:0.8rem;color:var(--ink-muted);max-width:640px;}
@media(max-width:820px){.pricing-grid{grid-template-columns:1fr;}}

/* ── COVERAGE ── */
#coverage{padding:5rem 0;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.coverage-inner{display:grid;grid-template-columns:1.1fr 1fr;gap:3rem;align-items:center;}
.coverage-cities{font-size:1.3rem;font-weight:600;margin-top:1rem;}
.coverage-note{font-size:0.92rem;color:var(--ink-dim);margin-top:0.7rem;max-width:420px;}
.coverage-map{width:100%;height:auto;}
@media(max-width:820px){.coverage-inner{grid-template-columns:1fr;gap:2rem;}}

/* ── TRUST ── */
#trust{padding:5rem 0;}
.trust-list{display:flex;flex-direction:column;margin-top:2.5rem;}
.trust-item{display:grid;grid-template-columns:2rem 1fr;gap:1.2rem;padding:1.6rem 0;border-top:1px solid var(--line);}
.trust-item:last-child{border-bottom:1px solid var(--line);}
.trust-check{color:var(--accent-dark);flex-shrink:0;}
.trust-title{font-weight:600;font-size:1rem;margin-bottom:0.3rem;}
.trust-desc{font-size:0.88rem;color:var(--ink-dim);line-height:1.6;}

/* ── FOOTER ── */
footer{padding:2.5rem 1.75rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:space-between;align-items:center;background:var(--surface);}
.footer-left{display:flex;flex-direction:column;gap:0.4rem;}
.footer-logo{font-weight:800;font-size:1rem;}
.footer-logo span{color:var(--accent);}
.footer-contact{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:0.85rem;}
.footer-contact a{text-decoration:none;font-weight:500;}
.footer-contact a:hover{color:var(--accent-dark);}
.footer-right{display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;}
.footer-powered{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-muted);}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}.reveal{opacity:1;transform:none;}}

/* ── CHAT WIDGET ── */
#ah-chat-btn{position:fixed;bottom:1.6rem;right:1.6rem;z-index:1000;width:58px;height:58px;border-radius:50%;background:var(--ink);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(20,24,28,0.28);transition:transform 0.2s;}
#ah-chat-btn:hover{transform:scale(1.06);}
#ah-chat-btn svg{pointer-events:none;}
.ah-chat-tip{position:fixed;bottom:2rem;right:5.4rem;z-index:999;background:var(--ink);color:#fff;font-size:0.78rem;font-weight:500;padding:0.55rem 0.9rem;border-radius:var(--radius);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s;}
#ah-chat-btn:hover + .ah-chat-tip{opacity:1;}
@media(max-width:640px){.ah-chat-tip{display:none;}}

#ah-chat-panel{position:fixed;bottom:5.6rem;right:1.6rem;z-index:1000;width:360px;max-height:min(70vh,540px);background:var(--surface);border:1px solid var(--line-strong);border-radius:calc(var(--radius)*1.5);box-shadow:0 20px 60px rgba(20,24,28,0.2);display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px) scale(0.98);opacity:0;pointer-events:none;transition:transform 0.25s ease,opacity 0.25s ease;}
#ah-chat-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all;}
.ah-header{display:flex;align-items:center;gap:0.7rem;padding:0.9rem 1rem;border-bottom:1px solid var(--line);background:var(--bg);}
.ah-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;flex-shrink:0;}
.ah-info{flex:1;}
.ah-name{font-weight:600;font-size:0.9rem;}
.ah-status{font-size:0.7rem;color:var(--ink-muted);display:flex;align-items:center;gap:0.35rem;}
.ah-dot{width:6px;height:6px;border-radius:50%;background:#2fa84f;}
.ah-close{background:none;border:none;color:var(--ink-muted);font-size:1.1rem;cursor:pointer;padding:0.2rem 0.4rem;}
.ah-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.65rem;}
.ah-msg{max-width:85%;padding:0.6rem 0.85rem;border-radius:12px;font-size:0.85rem;line-height:1.5;}
.ah-msg.bot{background:var(--bg);border-bottom-left-radius:4px;align-self:flex-start;}
.ah-msg.user{background:var(--ink);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.ah-typing{align-self:flex-start;background:var(--bg);border-radius:12px;border-bottom-left-radius:4px;padding:0.6rem 0.9rem;display:flex;gap:4px;}
.ah-typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-muted);animation:ahBounce 1.2s infinite;}
.ah-typing span:nth-child(2){animation-delay:.2s}
.ah-typing span:nth-child(3){animation-delay:.4s}
@keyframes ahBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.ah-input-bar{padding:0.7rem;border-top:1px solid var(--line);display:flex;gap:0.5rem;}
.ah-input{flex:1;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.55rem 0.9rem;font-family:'Inter',sans-serif;font-size:0.85rem;outline:none;color:var(--ink);}
.ah-input:focus{border-color:var(--accent);}
.ah-send{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s;}
.ah-send:hover{transform:scale(1.06);}
@media(max-width:480px){#ah-chat-panel{left:1rem;right:1rem;width:auto;bottom:5.2rem;}}
</style>
</head>
<body>

<!-- ══════════════════════ NAV ══════════════════════ -->
<nav>
  <a href="#hero" class="nav-logo">Aira<span>home</span></a>
  <div class="nav-mid">
    <a class="nav-phone" href="tel:+351XXXXXXXXX">
      <span class="badge-247">24/7</span>
      <span class="nav-phone-num">+351 XXX XXX XXX</span>
    </a>
    <div class="lang-badges">
      <span class="lang-badge">EN</span><span class="lang-badge">DE</span><span class="lang-badge">FR</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:0.8rem;">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('de')">DE</button>
      <button class="lang-btn" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" onclick="setLang('pt')">PT</button>
    </div>
    <a href="#request" class="nav-cta" data-i18n="nav_cta"></a>
  </div>
</nav>

<!-- ══════════════════════ HERO ══════════════════════ -->
<section id="hero">
  <div class="section-inner">
    <div class="hero-grid">
      <h1 class="hero-title" data-i18n="hero_h1"></h1>
      <p class="hero-sub" data-i18n="hero_h2"></p>
      <div class="hero-ctas">
        <a class="btn btn-primary" href="tel:+351XXXXXXXXX"><span data-i18n="hero_cta_call"></span>&nbsp;<span class="num mono">+351 XXX XXX XXX</span></a>
        <a class="btn btn-secondary" href="https://wa.me/351XXXXXXXXX" target="_blank" rel="noopener" data-i18n="hero_cta_wa"></a>
      </div>
      <div class="hero-langs">
        <span class="lang-badge">EN</span><span class="lang-badge">DE</span><span class="lang-badge">FR</span>
        <span class="hero-micro" data-i18n="hero_micro"></span>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════ REQUEST FORM ══════════════════════ -->
<section id="request">
  <div class="section-inner">
    <div class="form-panel reveal">
      <h2 class="form-heading" data-i18n="form_heading"></h2>
      <p class="form-desc" data-i18n="form_desc"></p>
      <form id="calloutForm">
        <div class="form-grid">
          <div class="form-field"><label class="form-label" data-i18n="f_name"></label><input class="form-input" name="name" type="text" data-i18n-ph="f_name_ph" required></div>
          <div class="form-field"><label class="form-label" data-i18n="f_phone"></label><input class="form-input" name="phone" type="tel" data-i18n-ph="f_phone_ph" required></div>
          <div class="form-field full"><label class="form-label" data-i18n="f_address"></label><input class="form-input" name="address" type="text" data-i18n-ph="f_address_ph" required></div>
          <div class="form-field full"><label class="form-label" data-i18n="f_problem"></label><textarea class="form-input" name="problem" data-i18n-ph="f_problem_ph" required></textarea></div>
          <div class="form-field full">
            <label class="form-label" data-i18n="f_urgency"></label>
            <div class="urgency-group">
              <div class="urgency-opt"><input type="radio" name="urgency" id="u-now" value="Now" checked><label class="urgency-label" for="u-now" data-i18n="f_urgency_now"></label></div>
              <div class="urgency-opt"><input type="radio" name="urgency" id="u-today" value="Today"><label class="urgency-label" for="u-today" data-i18n="f_urgency_today"></label></div>
              <div class="urgency-opt"><input type="radio" name="urgency" id="u-week" value="This week"><label class="urgency-label" for="u-week" data-i18n="f_urgency_week"></label></div>
            </div>
          </div>
        </div>
        <button type="submit" class="form-submit" data-i18n="f_submit"></button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </div>
</section>

<!-- ══════════════════════ HOW IT WORKS ══════════════════════ -->
<section id="how">
  <div class="section-inner">
    <span class="eyebrow" data-i18n="sec_how"></span>
    <div class="how-grid">
      <div class="how-step reveal"><div class="how-num">01</div><div class="how-title" data-i18n="how_1_title"></div><div class="how-desc" data-i18n="how_1_desc"></div></div>
      <div class="how-step reveal"><div class="how-num">02</div><div class="how-title" data-i18n="how_2_title"></div><div class="how-desc" data-i18n="how_2_desc"></div></div>
      <div class="how-step reveal"><div class="how-num">03</div><div class="how-title" data-i18n="how_3_title"></div><div class="how-desc" data-i18n="how_3_desc"></div></div>
    </div>
  </div>
</section>

<!-- ══════════════════════ WHAT WE FIX ══════════════════════ -->
<section id="fix">
  <div class="section-inner">
    <div class="fix-head">
      <span class="eyebrow" data-i18n="sec_fix"></span>
      <p class="fix-sub" data-i18n="fix_sub"></p>
    </div>

let currentLang = 'en';

function setLang(lang){
  if(!T[lang]) return;
  currentLang = lang;
  const t = T[lang];
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.dataset.i18nPh;
    if(t[key] !== undefined) el.placeholder = t[key];
  });
  document.documentElement.lang = lang;
}

// ══════════════════════════════════════════
// SCROLL REVEAL
// ══════════════════════════════════════════
(function(){
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
})();

// ══════════════════════════════════════════
// REQUEST FORM -> n8n webhook (airahome-site-leads)
// ══════════════════════════════════════════
document.getElementById('calloutForm').addEventListener('submit', function(e){
  e.preventDefault();
  const f = e.target, st = document.getElementById('formStatus'), btn = f.querySelector('.form-submit');
  const t = T[currentLang];
  const data = {
    name: f.name.value.trim(),
    phone: f.phone.value.trim(),
    address: f.address.value.trim(),
    problem: f.problem.value.trim(),
    urgency: f.urgency.value,
    language: currentLang,
    page: 'airahome.pt',
    source: 'form'
  };
  btn.disabled = true;
  st.className = 'form-status'; st.textContent = t.form_sending;
  fetch(LEADS_WEBHOOK, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
  }).then(r=>{
    if(!r.ok) throw new Error();
    st.className = 'form-status ok'; st.textContent = t.form_ok;
    f.reset(); btn.disabled = false;
  }).catch(()=>{
    st.className = 'form-status err'; st.textContent = t.form_err;
    btn.disabled = false;
  });
});

// ══════════════════════════════════════════
// CHAT WIDGET -> n8n webhook (airahome-chat, relay to Anthropic)
// Autocall to Alexandra/Katerina is NOT wired here — collected leads
// only reach Telegram via the airahome-site-leads webhook below.
// ══════════════════════════════════════════
(function(){
  const history = [];
  let busy = false, opened = false, leadSent = false;

  function systemPrompt(){
    return "You are the Airahome assistant — a 24/7 emergency callout service for homeowners in the Algarve (Portimão, Carvoeiro, Lagoa, Silves). "
    + "Detect the visitor's language from their first message and reply in that language for the rest of the conversation (support English, German, French; if they write in Portuguese, reply in Portuguese too). "
    + "Be direct, calm, and brief — 2-4 sentences per reply, no marketing tone. "
    + "Categories we fix: Plumbing (leaks, blocked drains, water heaters), Electrical (outages, wiring, fixtures), Locks & Keys (lockouts, broken locks), Furniture (assembly, repairs, mounting), General Repairs (doors, windows, small fixes), Appliances (AC, installation, troubleshooting). "
    + "Pricing: Emergency 2-3h callout €250 fixed. Same-day callout €135 fixed. Scheduled work €30/hour. Price covers the visit and diagnosis; parts and extended labour are quoted separately. "
    + "Your job: find out what's broken, get the address, get a phone number, and how urgent it is (Now / Today / This week). Ask one question at a time, don't interrogate. "
    + "Once you have all four (problem, address, phone, urgency), tell the visitor clearly that the team will call them back shortly to confirm the price and timing, then on that same reply append on its own line exactly this machine-readable tag (it will be hidden from the visitor): "
    + "<<LEAD>>{\"name\":\"(their name if given, else empty string)\",\"problem\":\"...\",\"address\":\"...\",\"phone\":\"...\",\"urgency\":\"Now|Today|This week\",\"language\":\"en|de|fr|pt\"}<<END>> "
    + "Only emit the tag once, when you actually have all four fields. Never invent details the visitor didn't give you.";
  }

  function ahAddMsg(role, text){
    const box = document.getElementById('ah-messages');
    const d = document.createElement('div');
    d.className = 'ah-msg ' + role;
    d.textContent = text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
  function ahShowTyping(){
    const box = document.getElementById('ah-messages');
    const d = document.createElement('div');
    d.className = 'ah-typing'; d.id = 'ah-typing';
    d.innerHTML = '<span></span><span></span><span></span>';
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  }
  function ahHideTyping(){ const e = document.getElementById('ah-typing'); if(e) e.remove(); }

  function extractLead(text){
    const m = text.match(/<<LEAD>>([\s\S]*?)<<END>>/);
    if(!m) return {clean:text, lead:null};
    let lead = null;
    try{ lead = JSON.parse(m[1]); }catch(err){ lead = null; }
    return {clean: text.replace(m[0], '').trim(), lead};
  }

  function sendLeadToTelegram(lead){
    if(leadSent) return;
    leadSent = true;
    fetch(LEADS_WEBHOOK, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: lead.name || '',
        phone: lead.phone || '',
        address: lead.address || '',
        problem: lead.problem || '',
        urgency: lead.urgency || '',
        language: lead.language || currentLang,
        page: 'airahome.pt',
        source: 'chat'
      })
    }).catch(()=>{});
  }

  async function ahSend(){
    if(busy) return;
    const inp = document.getElementById('ah-input');
    const text = inp.value.trim();
    if(!text) return;
    inp.value = '';
    ahAddMsg('user', text);
    history.push({role:'user', content:text});
    busy = true;
    ahShowTyping();
    try{
      const res = await fetch(CHAT_WEBHOOK, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ system: systemPrompt(), messages: history.slice(-12) })
      });
      const data = await res.json();
      ahHideTyping();
      const raw = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text
        : 'Sorry, something went wrong. Please call us directly.';
      const {clean, lead} = extractLead(raw);
      ahAddMsg('bot', clean);
      history.push({role:'assistant', content:raw});
      if(lead && lead.phone) sendLeadToTelegram(lead);
    }catch(e){
      ahHideTyping();
      ahAddMsg('bot', 'Connection error. Please call us directly.');
    }
    busy = false;
  }
  window.ahSend = ahSend;

  window.ahToggle = function(){
    const panel = document.getElementById('ah-chat-panel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      if(!opened){
        setTimeout(()=>{
          const greet = {
            en:"Hi — what's happened at your place? I'll get the details and have someone call you back.",
            de:'Hallo — was ist bei Ihnen passiert? Ich nehme die Details auf und wir rufen Sie zurück.',
            fr:"Bonjour — qu'est-ce qui se passe chez vous ? Je note les détails et nous vous rappelons.",
            pt:'Olá — o que se passou na sua casa? Vou registar os detalhes e ligamos-lhe de volta.'
          };
          ahAddMsg('bot', greet[currentLang] || greet.en);
        }, 300);
        opened = true;
      }
      setTimeout(()=>document.getElementById('ah-input').focus(), 100);
    }
  };
})();

setLang('en');
