<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aira Energia — poupar na fatura da luz no Algarve | EDP e mercado livre</title>
<meta name="description" content="Verificação gratuita da sua fatura de eletricidade. Calculadora de poupança, mudança de tarifário, painéis solares e eletricista licenciado no Algarve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810;--surface:#0b1120;--surface-2:#0e1626;
  --line:rgba(120,180,255,0.12);--line-strong:rgba(120,180,255,0.22);
  --volt:#00d4ff;--volt-soft:#4fc3f7;--arc:#a855f7;--arc-deep:#7c3aed;--spark:#eaf6ff;
  --ink:#dce6f2;--ink-dim:rgba(220,230,242,0.62);--ink-muted:rgba(220,230,242,0.42);
  --ok:#3ddc97;
  --radius:8px;--radius-pill:999px;--nav-h:72px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3{font-weight:700;letter-spacing:-0.02em;color:var(--spark);}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}
.section-inner{max-width:1120px;margin:0 auto;padding:0 1.75rem;position:relative;z-index:2;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--volt);font-weight:600;margin-bottom:0.9rem;display:block;}

/* ── FARADAY GRID BACKGROUND ── */
#faraday{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 59px, rgba(120,180,255,0.09) 59px 60px),
    repeating-linear-gradient(90deg, transparent 0 59px, rgba(120,180,255,0.09) 59px 60px);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 30%, #000 0%, transparent 85%);
  mask-image:radial-gradient(ellipse 80% 70% at 50% 30%, #000 0%, transparent 85%);
  opacity:0.5;}
#faraday::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle, var(--volt-soft) 1.1px, transparent 1.6px);
  background-size:60px 60px;background-position:-0.5px -0.5px;
  opacity:0.14;animation:nodePulse 6s ease-in-out infinite;}
@keyframes nodePulse{0%,100%{opacity:0.06;}50%{opacity:0.20;}}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.75rem;background:rgba(5,8,16,0.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);gap:1rem;}
.nav-logo{font-weight:800;font-size:1.15rem;letter-spacing:-0.01em;text-decoration:none;color:var(--spark);flex-shrink:0;}
.nav-logo span{color:var(--volt);text-shadow:0 0 12px rgba(0,212,255,0.6);}
.nav-mid{display:flex;align-items:center;gap:1rem;flex-wrap:nowrap;}
.nav-link{display:flex;align-items:center;gap:0.4rem;text-decoration:none;color:var(--ink-dim);font-size:0.82rem;font-weight:500;white-space:nowrap;transition:color 0.2s;}
.nav-link:hover{color:var(--volt);}
.lang-badges{display:flex;gap:0.3rem;}
.lang-badge{font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:600;letter-spacing:0.03em;color:var(--ink-dim);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.15rem 0.45rem;}
.lang-switch{display:flex;gap:0.15rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.2rem;flex-shrink:0;}
.lang-btn{font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:600;letter-spacing:0.03em;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:0.35rem 0.55rem;border-radius:var(--radius-pill);transition:background 0.2s,color 0.2s;}
.lang-btn.active{background:var(--volt);color:#04121a;}
.lang-btn:hover:not(.active){color:var(--ink);}
.nav-cta{font-weight:600;font-size:0.85rem;text-decoration:none;color:#04121a;background:var(--volt);border-radius:var(--radius);padding:0.6rem 1.1rem;white-space:nowrap;transition:box-shadow 0.2s,transform 0.15s;flex-shrink:0;box-shadow:0 0 0 1px var(--volt),0 0 18px rgba(0,212,255,0.35);}
.nav-cta:hover{box-shadow:0 0 0 1px var(--arc),0 0 26px rgba(168,85,247,0.55);}
@media(max-width:980px){.nav-mid .lang-badges{display:none;}}
@media(max-width:820px){.nav-cta{display:none;}.nav-link{display:none;}}

/* ── BUTTONS ── */
.btn{position:relative;display:inline-flex;align-items:center;gap:0.55rem;text-decoration:none;border-radius:var(--radius);padding:0.95rem 1.5rem;font-weight:600;font-size:0.95rem;cursor:pointer;border:1px solid var(--line-strong);transition:box-shadow 0.2s,transform 0.15s,border-color 0.2s;line-height:1.3;background:var(--surface-2);color:var(--ink);}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(135deg,rgba(0,212,255,0.16),rgba(168,85,247,0.16));border-color:var(--volt);color:var(--spark);box-shadow:0 0 0 1px rgba(0,212,255,0.4),0 0 20px rgba(0,212,255,0.22);}
.btn-primary:hover{animation:voltPulse 1.4s ease-in-out infinite;border-color:var(--arc);}
.btn-secondary:hover{border-color:var(--volt);box-shadow:0 0 16px rgba(0,212,255,0.2);}
@keyframes voltPulse{0%,100%{box-shadow:0 0 0 1px rgba(0,212,255,0.5),0 0 18px rgba(0,212,255,0.3);}50%{box-shadow:0 0 0 1px rgba(168,85,247,0.6),0 0 26px rgba(168,85,247,0.5);}}

/* ── HERO ── */
#hero{position:relative;padding:5rem 0 4rem;border-bottom:1px solid var(--line);overflow:hidden;}
#bolt{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.9;}
.hero-grid{display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem;max-width:780px;}
.hero-title{font-size:clamp(2.1rem,5.2vw,3.5rem);line-height:1.07;text-shadow:0 0 10px rgba(0,212,255,0.45),0 0 30px rgba(0,212,255,0.28),0 0 60px rgba(168,85,247,0.22);}
.hero-sub{font-size:clamp(1.05rem,2vw,1.22rem);color:var(--ink-dim);font-weight:400;max-width:640px;}
.hero-ctas{display:flex;flex-wrap:wrap;gap:0.85rem;margin-top:0.4rem;}
.hero-langs{display:flex;align-items:center;gap:0.6rem;margin-top:0.3rem;flex-wrap:wrap;}
.hero-micro{font-size:0.85rem;color:var(--ink-muted);}

/* ── CALCULATOR ── */
#calc{padding:4.5rem 0;border-bottom:1px solid var(--line);}
.calc-panel{position:relative;background:var(--surface-2);border-radius:calc(var(--radius)*2);padding:2.4rem;box-shadow:inset 0 0 0 1px var(--volt),0 0 28px rgba(0,212,255,0.14);}
.calc-panel::before,.calc-panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--volt);opacity:0.7;}
.calc-panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none;}
.calc-panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none;}
.calc-title{font-size:clamp(1.4rem,2.6vw,1.9rem);margin-bottom:1.4rem;}
.calc-modes{display:flex;gap:0.4rem;margin-bottom:1.1rem;}
.calc-mode{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:600;letter-spacing:0.04em;color:var(--ink-dim);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:0.4rem 0.9rem;cursor:pointer;transition:all 0.15s;}
.calc-mode.active{background:var(--volt);border-color:var(--volt);color:#04121a;}
.calc-inrow{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;}
.calc-field{display:flex;flex-direction:column;gap:0.4rem;flex:1;min-width:200px;}
.calc-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);}
.calc-input{background:var(--bg);border:1px solid var(--line-strong);border-bottom:2px solid var(--volt);border-radius:var(--radius) var(--radius) 0 0;padding:0.8rem 0.9rem;font-family:'JetBrains Mono',monospace;font-size:1.15rem;color:var(--spark);outline:none;caret-color:var(--volt);width:100%;transition:box-shadow 0.2s;}
.calc-input:focus{box-shadow:0 6px 18px -6px rgba(0,212,255,0.5);}
.calc-btn{background:linear-gradient(135deg,var(--volt),var(--volt-soft));color:#04121a;border:none;border-radius:var(--radius);padding:0.85rem 1.6rem;font-weight:700;font-size:0.95rem;cursor:pointer;transition:box-shadow 0.2s;box-shadow:0 0 18px rgba(0,212,255,0.35);}
.calc-btn:hover{box-shadow:0 0 28px rgba(0,212,255,0.6);}
.calc-results{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.8rem;}
.calc-res{background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius);padding:1.2rem;opacity:0.35;transition:opacity 0.4s;}
.calc-res.lit{opacity:1;animation:neonUp 0.55s ease-out;}
@keyframes neonUp{0%{filter:brightness(0.4);box-shadow:none;}100%{filter:brightness(1);box-shadow:0 0 22px rgba(0,212,255,0.22);}}
.calc-res-label{font-family:'JetBrains Mono',monospace;font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:0.5rem;}
.calc-res-val{font-family:'JetBrains Mono',monospace;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:700;color:var(--volt);text-shadow:0 0 14px rgba(0,212,255,0.5);}
.calc-res-hint{font-size:0.78rem;color:var(--ink-muted);margin-top:0.35rem;}
.calc-disclaimer{font-size:0.74rem;color:var(--ink-muted);margin-top:1.4rem;line-height:1.5;border-top:1px solid var(--line);padding-top:1rem;}
@media(max-width:620px){.calc-results{grid-template-columns:1fr;}.calc-panel{padding:1.6rem;}}

/* ── SERVICES ── */
#services{padding:5rem 0;border-bottom:1px solid var(--line);}
.svc-head{max-width:640px;margin-bottom:2.5rem;}
.svc-sub{color:var(--ink-dim);font-size:0.95rem;margin-top:0.6rem;}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.svc-tile{background:var(--surface);padding:1.9rem 1.6rem;display:flex;flex-direction:column;gap:0.8rem;transition:background 0.2s;}
.svc-tile:hover{background:var(--surface-2);}
.svc-icon{width:30px;height:30px;color:var(--volt);}
.svc-name{font-weight:600;font-size:1.05rem;color:var(--spark);}
.svc-desc{font-size:0.85rem;color:var(--ink-dim);line-height:1.55;}
@media(max-width:820px){.svc-grid{grid-template-columns:1fr;}}

/* ── PRICING ── */
#pricing{padding:5rem 0;border-bottom:1px solid var(--line);}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-top:2.5rem;}
.plan{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:calc(var(--radius)*1.5);padding:2rem 1.6rem;display:flex;flex-direction:column;}
.plan.featured{border-color:var(--volt);box-shadow:0 0 0 1px var(--volt),0 0 24px rgba(0,212,255,0.18);}
.plan-name{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:0.3rem;}
.plan-sub{font-size:0.78rem;color:var(--ink-muted);margin-bottom:1.2rem;}
.plan-price{font-family:'JetBrains Mono',monospace;font-size:2.3rem;font-weight:700;letter-spacing:-0.02em;line-height:1;color:var(--spark);}
.plan-period{font-size:0.82rem;color:var(--ink-dim);margin-top:0.4rem;margin-bottom:1.3rem;}
.plan-desc{font-size:0.86rem;color:var(--ink-dim);line-height:1.6;flex:1;}
.pricing-note{margin-top:1.8rem;font-size:0.8rem;color:var(--ink-muted);max-width:640px;}
@media(max-width:820px){.pricing-grid{grid-template-columns:1fr;}}

/* ── HOW ── */
#how{padding:5rem 0;border-bottom:1px solid var(--line);}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem;margin-top:2.5rem;}
.how-step{border-top:2px solid var(--volt);padding-top:1.2rem;}
.how-num{font-family:'JetBrains Mono',monospace;font-size:0.78rem;font-weight:700;color:var(--volt);margin-bottom:0.8rem;}
.how-title{font-size:1.15rem;margin-bottom:0.5rem;color:var(--spark);}
.how-desc{font-size:0.9rem;color:var(--ink-dim);line-height:1.6;}
@media(max-width:820px){.how-grid{grid-template-columns:1fr;gap:2rem;}}

/* ── ELEKTRA ── */
#elektra{padding:5rem 0;border-bottom:1px solid var(--line);}
.elektra-panel{background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(168,85,247,0.08));border:1px solid var(--line-strong);border-radius:calc(var(--radius)*2);padding:2.6rem;max-width:760px;}
.elektra-title{font-size:clamp(1.4rem,2.8vw,2rem);margin-bottom:0.6rem;}
.elektra-desc{color:var(--ink-dim);font-size:0.95rem;margin-bottom:1.6rem;max-width:560px;}
.elektra-ctas{display:flex;gap:0.85rem;flex-wrap:wrap;}

/* ── FORM ── */
#request{padding:5rem 0;border-bottom:1px solid var(--line);}
.form-panel{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:calc(var(--radius)*2);padding:2.4rem;box-shadow:0 0 30px rgba(0,212,255,0.08);}
.form-heading{font-size:clamp(1.4rem,2.6vw,1.85rem);margin-bottom:0.4rem;}
.form-desc{color:var(--ink-dim);font-size:0.92rem;margin-bottom:1.7rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem;}
.form-field{display:flex;flex-direction:column;gap:0.4rem;}
.form-field.full{grid-column:1 / -1;}
.form-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);}
.form-input{background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--radius);padding:0.78rem 0.9rem;font-family:'Inter',sans-serif;font-size:0.95rem;color:var(--ink);outline:none;transition:border-color 0.2s,box-shadow 0.2s;width:100%;}
.form-input::placeholder{color:var(--ink-muted);}
.form-input:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(0,212,255,0.12);}
.interest-group{display:flex;gap:0.6rem;flex-wrap:wrap;}
.interest-opt{position:relative;}
.interest-opt input{position:absolute;opacity:0;inset:0;cursor:pointer;}
.interest-label{display:block;font-size:0.85rem;font-weight:500;padding:0.6rem 1rem;border:1px solid var(--line-strong);border-radius:var(--radius-pill);color:var(--ink-dim);cursor:pointer;transition:all 0.15s;}
.interest-opt input:checked + .interest-label{background:var(--volt);border-color:var(--volt);color:#04121a;}
.form-submit{margin-top:1.7rem;background:linear-gradient(135deg,var(--volt),var(--volt-soft));color:#04121a;border:none;border-radius:var(--radius);padding:0.9rem 1.9rem;font-weight:700;font-size:0.95rem;cursor:pointer;transition:box-shadow 0.2s;box-shadow:0 0 18px rgba(0,212,255,0.3);}
.form-submit:hover{box-shadow:0 0 30px rgba(0,212,255,0.55);}
.form-submit:disabled{opacity:0.55;cursor:default;box-shadow:none;}
.form-status{font-size:0.85rem;margin-top:1rem;min-height:1.2em;}
.form-status.ok{color:var(--ok);}
.form-status.err{color:var(--arc);}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}.form-panel{padding:1.6rem;}}

/* ── COVERAGE ── */
#coverage{padding:5rem 0;border-bottom:1px solid var(--line);}
.coverage-cities{font-size:1.25rem;font-weight:600;margin-top:1rem;color:var(--spark);line-height:1.6;}
.coverage-note{font-size:0.92rem;color:var(--ink-dim);margin-top:0.7rem;max-width:520px;}

/* ── FOOTER ── */
footer{padding:3rem 1.75rem 2.5rem;border-top:1px solid var(--line);background:var(--surface);position:relative;z-index:2;}
.footer-inner{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:2rem;justify-content:space-between;}
.footer-left{display:flex;flex-direction:column;gap:0.6rem;max-width:340px;}
.footer-logo{font-weight:800;font-size:1rem;color:var(--spark);}
.footer-logo span{color:var(--volt);}
.footer-legal{font-size:0.8rem;color:var(--ink-muted);line-height:1.6;}
.footer-services{display:flex;flex-direction:column;gap:0.5rem;}
.footer-services-label{font-family:'JetBrains Mono',monospace;font-size:0.66rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:0.3rem;}
.footer-services a{font-size:0.86rem;color:var(--ink-dim);text-decoration:none;transition:color 0.2s;}
.footer-services a:hover{color:var(--volt);}
.footer-right{display:flex;flex-direction:column;align-items:flex-start;gap:0.7rem;}
.footer-powered{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-muted);}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(18px);transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.in{opacity:1;transform:none;}

@media(max-width:700px){
  #bolt{display:none;}
  #faraday{opacity:0.32;}
  #faraday::after{animation:none;opacity:0.10;}
  .hero-title{text-shadow:0 0 10px rgba(0,212,255,0.4);}
  .form-panel,.plan.featured{box-shadow:none;}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
  .reveal{opacity:1;transform:none;}
  #bolt{display:none;}
  #faraday::after{animation:none;}
}
</style>
</head>
<body>

<div id="faraday" aria-hidden="true"></div>

<!-- ══════════════════════ NAV ══════════════════════ -->
<nav>
  <a href="#hero" class="nav-logo">Aira<span>&nbsp;Energia</span></a>
  <div class="nav-mid">
    <a class="nav-link" href="/airahome">Airahome</a>
    <div class="lang-badges">
      <span class="lang-badge">PT</span><span class="lang-badge">EN</span><span class="lang-badge">DE</span><span class="lang-badge">FR</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:0.8rem;">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('pt')">PT</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('de')">DE</button>
      <button class="lang-btn" onclick="setLang('fr')">FR</button>
    </div>
    <a href="#request" class="nav-cta" data-i18n="nav_cta"></a>
  </div>
</nav>

<!-- ══════════════════════ HERO ══════════════════════ -->
<section id="hero">
  <canvas id="bolt" aria-hidden="true"></canvas>
  <div class="section-inner">
    <div class="hero-grid">
      <h1 class="hero-title" data-i18n="hero_h1"></h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
      <div class="hero-ctas">
        <a class="btn btn-primary" href="#calc" data-i18n="hero_cta_calc"></a>
        <a class="btn btn-secondary" href="#request" data-i18n="hero_cta_form"></a>
      </div>
      <div class="hero-langs">
        <span class="lang-badge">PT</span><span class="lang-badge">EN</span><span class="lang-badge">DE</span><span class="lang-badge">FR</span>
        <span class="hero-micro" data-i18n="hero_micro"></span>
      </div>
    </div>
  </div>
</section>

<!-- ══════════════════════ CALCULATOR ══════════════════════ -->
<section id="calc">
  <div class="section-inner">
    <span class="eyebrow" data-i18n="calc_eyebrow"></span>
    <div class="calc-panel reveal">
      <h2 class="calc-title" data-i18n="calc_title"></h2>
      <div class="calc-modes">
        <button type="button" class="calc-mode active" id="mode-bill" onclick="setCalcMode('bill')" data-i18n="calc_mode_bill"></button>
        <button type="button" class="calc-mode" id="mode-kwh" onclick="setCalcMode('kwh')" data-i18n="calc_mode_kwh"></button>
      </div>
      <div class="calc-inrow">
        <div class="calc-field">
          <label class="calc-label" id="calc-input-label" data-i18n="calc_input_label_bill"></label>
          <input class="calc-input" id="calc-input" type="number" min="0" step="1" inputmode="decimal" data-i18n-ph="calc_input_ph" onkeydown="if(event.key==='Enter'){event.preventDefault();runCalc();}">
        </div>
        <button type="button" class="calc-btn" onclick="runCalc()" data-i18n="calc_btn"></button>
      </div>

const WA_TEXT = {
  pt:'Olá, vim da página Aira Energia — quero ajuda com a fatura da luz.',
  en:'Hi, I came from the Aira Energia page — I want help with my electricity bill.',
  de:'Hallo, ich komme von der Aira-Energia-Seite — ich möchte Hilfe bei meiner Stromrechnung.',
  fr:'Bonjour, je viens de la page Aira Energia — je souhaite de l’aide pour ma facture d’électricité.'
};

let currentLang = 'pt';
let calcMode = 'bill';

function setLang(lang){
  if(!T[lang]) return;
  currentLang = lang;
  const t = T[lang];
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.dataset.i18nPh;
    if(t[key] !== undefined) el.placeholder = t[key];
  });
  // calculator input label depends on mode
  const lbl = document.getElementById('calc-input-label');
  lbl.textContent = calcMode === 'bill' ? t.calc_input_label_bill : t.calc_input_label_kwh;
  // whatsapp link
  document.getElementById('wa-link').href =
    'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(WA_TEXT[lang] || WA_TEXT.pt);
  document.documentElement.lang = lang;
}

function setCalcMode(mode){
  calcMode = mode;
  document.getElementById('mode-bill').classList.toggle('active', mode === 'bill');
  document.getElementById('mode-kwh').classList.toggle('active', mode === 'kwh');
  const t = T[currentLang];
  document.getElementById('calc-input-label').textContent =
    mode === 'bill' ? t.calc_input_label_bill : t.calc_input_label_kwh;
}

function fmtRange(lo, hi){
  const r = n => '€' + Math.round(n);
  return r(lo) + '–' + r(hi) + '/' + (currentLang === 'fr' ? 'mois' : currentLang === 'de' ? 'Mon.' : currentLang === 'en' ? 'mo' : 'mês');
}

function runCalc(){
  const raw = parseFloat(document.getElementById('calc-input').value);
  const tEl = document.getElementById('res-tariff'), sEl = document.getElementById('res-solar');
  const tVal = document.getElementById('res-tariff-val'), sVal = document.getElementById('res-solar-val');
  if(!raw || raw <= 0 || !isFinite(raw)){
    tVal.textContent = '—'; sVal.textContent = '—';
    tEl.classList.remove('lit'); sEl.classList.remove('lit');
    return;
  }
  // normalise to a monthly bill B in €
  const B = calcMode === 'bill' ? raw : raw * PRICE_NOW;
  const tariffLo = B * 0.10, tariffHi = B * 0.30;
  const solarLo = B * DAY_SHARE * SOLAR_MIN, solarHi = B * DAY_SHARE * SOLAR_MAX;
  tVal.textContent = fmtRange(tariffLo, tariffHi);
  sVal.textContent = fmtRange(solarLo, solarHi);
  // re-trigger the neon animation
  tEl.classList.remove('lit'); sEl.classList.remove('lit');
  void tEl.offsetWidth;
  tEl.classList.add('lit'); sEl.classList.add('lit');
}

function openElektra(){
  const w = document.querySelector('elevenlabs-convai');
  if(w){
    try{
      if(typeof w.open === 'function'){ w.open(); return; }
      w.setAttribute('data-expanded','true');
      const btn = w.shadowRoot && w.shadowRoot.querySelector('button');
      if(btn){ btn.click(); return; }
    }catch(e){}
  }
  window.open('https://elevenlabs.io/app/talk-to?agent_id=' + ELEKTRA_AGENT_ID, '_blank', 'noopener');
}

// SCROLL REVEAL
// ══════════════════════════════════════════
(function(){
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
})();

// ══════════════════════════════════════════
// REQUEST FORM -> n8n webhook (energia-site-leads)
// ══════════════════════════════════════════
document.getElementById('energiaForm').addEventListener('submit', function(e){
  e.preventDefault();
  const f = e.target, st = document.getElementById('formStatus'), btn = f.querySelector('.form-submit');
  const t = T[currentLang];
  const interests = Array.from(f.querySelectorAll('input[name="interest"]:checked')).map(i=>i.value);
  const data = {
    name: f.name.value.trim(),
    phone: f.phone.value.trim(),
    freguesia: f.freguesia.value.trim(),
    bill: f.bill.value.trim(),
    interests: interests,
    language: currentLang,
    page: 'energia',
    source: 'form'
  };
  btn.disabled = true;
  st.className = 'form-status'; st.textContent = t.form_sending;
  fetch(LEADS_WEBHOOK, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
  }).then(r=>{
    if(!r.ok) throw new Error();
    st.className = 'form-status ok'; st.textContent = t.form_ok;
    f.reset(); btn.disabled = false;
  }).catch(()=>{
    st.className = 'form-status err'; st.textContent = t.form_err;
    btn.disabled = false;
  });
});

// ══════════════════════════════════════════
// PROCEDURAL LIGHTNING (hero canvas, 2D)
// disabled on <=700px and prefers-reduced-motion
// ══════════════════════════════════════════
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = window.matchMedia('(max-width: 700px)').matches;
  if(reduce || small) return;

  const canvas = document.getElementById('bolt');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let running = true, visible = true, rafId = null;
  let flash = null; // {segments, born, life, color}

  function resize(){
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  let rt;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(resize, 200); });

  function midpoint(a, b, displace, out){
    if(displace < 1.2){ out.push(a); return; }
    const mx = (a.x + b.x) / 2 + (Math.random() - 0.5) * displace;
    const my = (a.y + b.y) / 2 + (Math.random() - 0.5) * displace;
    const mid = {x: mx, y: my};
    midpoint(a, mid, displace / 2, out);
    midpoint(mid, b, displace / 2, out);
  }

  function makeBolt(){
    const startX = W * (0.15 + Math.random() * 0.7);
    const a = {x: startX, y: -10};
    const b = {x: startX + (Math.random() - 0.5) * W * 0.5, y: H + 10};
    const pts = [];
    midpoint(a, b, W * 0.28, pts);
    pts.push(b);
    const branches = [];
    const bn = 1 + Math.floor(Math.random() * 2);
    for(let i = 0; i < bn; i++){
      const idx = Math.floor(pts.length * (0.3 + Math.random() * 0.4));
      const p0 = pts[idx];
      if(!p0) continue;
      const p1 = {x: p0.x + (Math.random() - 0.5) * W * 0.3, y: p0.y + H * (0.15 + Math.random() * 0.25)};
      const bp = [];
      midpoint(p0, p1, W * 0.12, bp);
      bp.push(p1);
      branches.push(bp);
    }
    flash = {
      main: pts, branches: branches,
      born: performance.now(),
      life: 90 + Math.random() * 70,
      color: Math.random() < 0.5 ? '#00d4ff' : '#a855f7'
    };
  }

  function strokePath(pts, width, color, alpha){
    if(pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = width * 4;
    ctx.stroke();
  }

  function frame(now){
    if(!running || !visible){ rafId = null; return; }
    ctx.clearRect(0, 0, W, H);
    if(flash){
      const age = now - flash.born;
      const k = 1 - age / flash.life;
      if(k <= 0){
        flash = null;
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        scheduleNext();
        return;
      }
      strokePath(flash.main, 5, flash.color, 0.18 * k);
      flash.branches.forEach(b => strokePath(b, 3, flash.color, 0.14 * k));
      strokePath(flash.main, 1.4, '#eaf6ff', 0.9 * k);
      flash.branches.forEach(b => strokePath(b, 1, '#eaf6ff', 0.7 * k));
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
    rafId = requestAnimationFrame(frame);
  }

  let nextTimer = null;
  function scheduleNext(){
    clearTimeout(nextTimer);
    const wait = 2500 + Math.random() * 3500;
    nextTimer = setTimeout(()=>{
      if(running && visible){
        makeBolt();
        if(!rafId) rafId = requestAnimationFrame(frame);
      }
    }, wait);
  }

  const hero = document.getElementById('hero');
  const io = new IntersectionObserver((entries)=>{
    visible = entries[0].isIntersecting;
    if(visible && running && !rafId) rafId = requestAnimationFrame(frame);
  }, {threshold: 0.01});
  io.observe(hero);

  document.addEventListener('visibilitychange', ()=>{
    running = !document.hidden;
    if(running && visible && !rafId) rafId = requestAnimationFrame(frame);
  });

  scheduleNext();
})();
